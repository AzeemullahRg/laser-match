<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laser Match</title>
<style>
  :root { --ink: #2d2850; --dim: #6c6385; --bg: #efe9fb; --card: #fffdfe; --accent: #7a55c8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #ece8f7; --dim: #a9a1c2; --bg: #17142a; --card: #221e3a; --accent: #b79cff; }
  }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; background: var(--card); border-radius: 20px;
    padding: 32px 28px; text-align: center; box-shadow: 0 12px 36px rgba(60, 40, 110, .12); }
  h1 { margin: 0 0 8px; font-size: 30px; }
  p { color: var(--dim); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Laser Match</h1>
  <p>A relaxing mirror puzzle game for Android by Meeza Games. Move and turn mirrors to light every
  lamp with its own color: 1,000 puzzles, no timers.</p>
  <p><a href="privacy-policy.html">Privacy policy</a> · <a href="mailto:azeemzafar67@gmail.com">Contact</a></p>
</main>
</body>
</html>
